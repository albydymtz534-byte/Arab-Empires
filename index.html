<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE LAST EMPIRE</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#101820;color:#fff;
 font-family:Tahoma,Arial,sans-serif;overflow:hidden
}
header{
 height:65px;background:#151d25;
 border-bottom:2px solid #d2a83e;
 display:flex;align-items:center;justify-content:space-around;
 gap:5px;padding:5px
}
.logo{color:#e9c35e;font-weight:bold;font-size:17px;direction:ltr}
.resources{display:flex;gap:7px;flex-wrap:wrap}
.resource{
 background:#26313b;border:1px solid #a78131;
 border-radius:7px;padding:7px;font-size:13px
}
.resource b{color:#f5d578}
#map{height:calc(100vh - 65px);width:100%;background:#152b3c}
.leaflet-container{background:#152b3c}
.leaflet-tooltip{
 background:#171b20;color:#ffe18b;
 border:1px solid #d6ad50;font-weight:bold
}
#countryPanel{
 position:absolute;bottom:15px;right:15px;z-index:1000;
 background:#151d25;border:2px solid #c49a3b;
 border-radius:10px;padding:15px;width:240px;
 display:none;box-shadow:0 4px 20px #000
}
#countryPanel h3{color:#f3d276;margin:0 0 10px}
button{
 background:#74551b;color:white;border:1px solid #e0b84f;
 border-radius:6px;padding:9px;margin-top:7px;
 width:100%;cursor:pointer
}
button:hover{background:#a77b24}
#message{
 position:absolute;bottom:15px;left:15px;z-index:1000;
 background:#151d25;border:1px solid #c49a3b;
 padding:10px;border-radius:7px;font-size:12px
}
@media(max-width:500px){
 header{height:75px;flex-direction:column}
 .logo{font-size:14px}
 .resource{padding:4px;font-size:11px}
 #map{height:calc(100vh - 75px)}
}
</style>
</head>

<body>

<header>
 <div class="logo">THE LAST EMPIRE 👑</div>
 <div class="resources">
  <div class="resource">💰 المال: <b id="money">10000</b></div>
  <div class="resource">🛢️ النفط: <b id="oil">5000</b></div>
  <div class="resource">🪵 الخشب: <b id="wood">5000</b></div>
  <div class="resource">⛓️ الحديد: <b id="iron">5000</b></div>
 </div>
</header>

<div id="map"></div>

<div id="countryPanel">
 <h3 id="countryName">الدولة</h3>
 <div>👑 دولة الإمبراطورية</div>
 <button onclick="build('farm')">🌾 بناء مزرعة</button>
 <button onclick="build('factory')">🏭 بناء مصنع</button>
 <button onclick="build('base')">🏰 بناء قاعدة</button>
 <button onclick="closePanel()">إغلاق</button>
</div>

<div id="message">🗺️ اضغط على دولة لاختيارها</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map("map",{zoomControl:true})
 .setView([25,35],4);

let selectedLayer=null;
let selectedCountry="";
let money=10000,oil=5000,wood=5000,iron=5000;

const countries={
 DZA:"الجزائر",BHR:"البحرين",COM:"جزر القمر",
 DJI:"جيبوتي",EGY:"مصر",IRQ:"العراق",JOR:"الأردن",
 KWT:"الكويت",LBN:"لبنان",LBY:"ليبيا",
 MRT:"موريتانيا",MAR:"المغرب",OMN:"عُمان",
 PSE:"فلسطين",QAT:"قطر",SAU:"السعودية",
 SOM:"الصومال",SDN:"السودان",SYR:"سوريا",
 TUN:"تونس",ARE:"الإمارات",YEM:"اليمن"
};

function chooseCountry(name,layer){
 if(selectedLayer){
  geoLayer.resetStyle(selectedLayer);
 }
 selectedLayer=layer;
 selectedCountry=name;
 layer.setStyle({fillColor:"#e4b83e",fillOpacity:0.95,weight:3});
 document.getElementById("countryName").textContent="👑 "+name;
 document.getElementById("countryPanel").style.display="block";
 document.getElementById("message").textContent="الدولة المختارة: "+name;
 saveGame();
}

function closePanel(){
 document.getElementById("countryPanel").style.display="none";
}

function updateResources(){
 document.getElementById("money").textContent=money.toLocaleString();
 document.getElementById("oil").textContent=oil.toLocaleString();
 document.getElementById("wood").textContent=wood.toLocaleString();
 document.getElementById("iron").textContent=iron.toLocaleString();
}

function saveGame(){
 localStorage.setItem("lastEmpire",JSON.stringify({
 money,oil,wood,iron,selectedCountry
 }));
}

function loadGame(){
 try{
  const saved=JSON.parse(localStorage.getItem("lastEmpire"));
  if(saved){
   money=saved.money;
   oil=saved.oil;
   wood=saved.wood;
   iron=saved.iron;
   selectedCountry=saved.selectedCountry||"";
  }
 }catch(e){}
 updateResources();
}

loadGame();
// =====================================
// تحميل خريطة الوطن العربي
// =====================================

let geoLayer = null;

const countryColors = [
    "#315d55", "#76503b", "#355c78",
    "#694b72", "#80632b", "#526b39"
];

const geoUrl =
"https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson";

fetch(geoUrl)
.then(response => {
    if (!response.ok) throw new Error("Map error");
    return response.json();
})
.then(data => {

    const features = data.features.filter(feature => {
        const p = feature.properties;

        const code =
            p.ISO_A3 ||
            p.ADM0_A3 ||
            p.SOV_A3 ||
            p["ISO3166-1-Alpha-3"];

        return countries[code] !== undefined;
    });

    geoLayer = L.geoJSON(features, {

        style: feature => {
            const p = feature.properties;
            const code =
                p.ISO_A3 ||
                p.ADM0_A3 ||
                p.SOV_A3 ||
                p["ISO3166-1-Alpha-3"];

            const index = Object.keys(countries).indexOf(code);

            return {
                color: "#e9c66b",
                weight: 1.5,
                fillColor: countryColors[index % countryColors.length],
                fillOpacity: 0.8
            };
        },

        onEachFeature: (feature, layer) => {

            const p = feature.properties;
            const code =
                p.ISO_A3 ||
                p.ADM0_A3 ||
                p.SOV_A3 ||
                p["ISO3166-1-Alpha-3"];

            const name = countries[code];

            if (!name) return;

            layer.bindTooltip(name, {
                permanent: true,
                direction: "center",
                className: "arab-country-label"
            });

            layer.on("mouseover", function() {
                if (selectedLayer !== this) {
                    this.setStyle({
                        fillColor: "#e8bd55",
                        fillOpacity: 1,
                        weight: 2.5
                    });
                }
            });

            layer.on("mouseout", function() {
                if (selectedLayer !== this) {
                    geoLayer.resetStyle(this);
                }
            });

            layer.on("click", function() {
                chooseCountry(name, this);
            });
        }

    }).addTo(map);

    map.fitBounds(geoLayer.getBounds(), {
        padding: [20, 20]
    });

    // استعادة لون الدولة المحفوظة
    if (selectedCountry) {
        geoLayer.eachLayer(layer => {
            const p = layer.feature.properties;
            const code =
                p.ISO_A3 ||
                p.ADM0_A3 ||
                p.SOV_A3 ||
                p["ISO3166-1-Alpha-3"];

            if (countries[code] === selectedCountry) {
                chooseCountry(selectedCountry, layer);
            }
        });
    }

})
.catch(error => {
    console.error(error);
    document.getElementById("message").textContent =
        "تعذر تحميل الخريطة. تحقق من الإنترنت وأعد المحاولة.";
});


// =====================================
// نظام البناء
// =====================================

let buildings = {
    farm: 0,
    factory: 0,
    base: 0
};

function build(type) {

    if (!selectedCountry) {
        alert("اختر دولة أولاً!");
        return;
    }

    const costs = {
        farm: {
            money: 500,
            wood: 100,
            iron: 50
        },

        factory: {
            money: 1200,
            wood: 200,
            iron: 300
        },

        base: {
            money: 2000,
            wood: 300,
            iron: 500,
            oil: 100
        }
    };

    const names = {
        farm: "مزرعة",
        factory: "مصنع",
        base: "قاعدة عسكرية"
    };

    const cost = costs[type];

    for (const resource in cost) {
        if (window[resource] < cost[resource]) {
            alert("مواردك لا تكفي لبناء " + names[type]);
            return;
        }
    }

    for (const resource in cost) {
        window[resource] -= cost[resource];
    }

    buildings[type]++;

    updateResources();
    saveGame();

    alert("تم بناء " + names[type] + " في " + selectedCountry);
}


// =====================================
// الإنتاج التلقائي
// =====================================

setInterval(() => {

    money += 20 + buildings.factory * 15;
    oil += 10;
    wood += 10 + buildings.farm * 5;
    iron += 5 + buildings.factory * 5;

    updateResources();
    saveGame();

}, 10000);


// =====================================
// الحفظ المطور
// =====================================

const oldSave = saveGame;

saveGame = function() {

    localStorage.setItem("lastEmpire", JSON.stringify({
        money,
        oil,
        wood,
        iron,
        selectedCountry,
        buildings
    }));

};

function loadBuildings() {

    try {
        const saved = JSON.parse(
            localStorage.getItem("lastEmpire")
        );

        if (saved && saved.buildings) {
            buildings = saved.buildings;
        }

    } catch (e) {}
}

loadBuildings();
saveGame();
</script>

<style>
.arab-country-label {
    background: #17120c;
    border: 1px solid #e8bd55;
    color: #ffe29a;
    font-weight: bold;
    font-size: 11px;
    padding: 3px 5px;
    border-radius: 5px;
    box-shadow: 0 1px 5px #000;
}
</style>

</body>
</html>
